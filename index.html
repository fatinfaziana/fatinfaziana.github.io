<template id="p-impact" data-c="#cfc2ea">
<span class="k">03 · Contributions</span><h2>From struggling to A.</h2>
<div class="quote">Every student can improve. They just need someone to find where it breaks.</div>
<div class="row"><div><em>50% A</em><span>in Accounting, Business Studies and Economics under my leadership</span></div><div><em>6+ yrs</em><span>of IGCSE results work</span></div></div>
<h3>How I do it</h3>
<ol class="steps"><li><b>Find the gap.</b> Diagnose exactly which topics and habits cost marks.</li><li><b>Rebuild understanding.</b> Explain step by step until it makes sense, not just memorised.</li><li><b>Practise with purpose.</b> Past-year topical questions, checked thoroughly.</li><li><b>Exam technique.</b> Timing and mark-scheme thinking, so knowledge turns into grades.</li></ol>
<h3>Beyond the classroom</h3>
<ul class="list"><li>Organised <b>entrepreneurship events</b> for students, which received national media coverage.</li><li>Mentored a student project to <b>3rd place</b> at a university competition.</li></ul>
</template>

<template id="p-trading" data-c="#cfc2ea">
<span class="k">04 · Beyond teaching</span><h2>Trading.</h2>
<p class="lead">I treat trading like exam prep: study it, practise it, review it.</p>
<h3>My rules</h3>
<ul class="list"><li><b>Risk first.</b> Know the loss before entering; size accordingly.</li><li><b>Trade the plan.</b> Defined setups and exits, no improvising.</li><li><b>Journal everything.</b> Review every week.</li><li><b>Keep learning.</b> Markets change, so study never stops.</li></ul>
<p class="note">A personal approach, not financial advice. Trading involves risk of loss.</p>
</template>
